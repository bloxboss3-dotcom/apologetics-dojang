name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Before the build, because the one rule this enforces catches a class of
      # bug the build cannot see. A hook added below an early return is valid
      # JavaScript and a blank page on the live site — it happened once, on the
      # screen you reach by finishing your first unit. eslint.config.js makes
      # rules-of-hooks an error and leaves almost everything else alone.
      - run: npm run lint
      - run: npm run build
      # Kept after the build on purpose. This step is the one that fails when
      # Pages is off, and behind the build it fails having already proved the
      # app compiles. vite.config.js hardcodes base: "./", so nothing here
      # consumes this step's base_path output and the order is free.
      #
      # Pages must already be on, with Settings -> Pages -> Source: GitHub
      # Actions. Enabling it from here (enablement: true) does not work: the
      # workflow's GITHUB_TOKEN cannot create a Pages site and the run fails
      # with "Resource not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
