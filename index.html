<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D12" />
    <meta name="description" content="Apologetics training — read, drill, spar." />
    <title>Apologetics Dojang</title>

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon-96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Link previews. og:image must be absolute — relative paths are ignored by
         every scraper, so this one URL is hardcoded to the Pages site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apologetics Dojang" />
    <meta property="og:title" content="Apologetics Dojang" />
    <meta property="og:description" content="Apologetics training built as a game. Read, drill, spar." />
    <meta property="og:url" content="https://bloxboss3-dotcom.github.io/apologetics-dojang/" />
    <meta property="og:image" content="https://bloxboss3-dotcom.github.io/apologetics-dojang/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A gold shield holding an open book, above the words Apologetics Dojang." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apologetics Dojang" />
    <meta name="twitter:description" content="Apologetics training built as a game. Read, drill, spar." />
    <meta name="twitter:image" content="https://bloxboss3-dotcom.github.io/apologetics-dojang/og.png" />
    <style>
      html, body { margin: 0; padding: 0; background: #0A0D12; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Mount guard. If this file is ever served unbuilt — GitHub Pages set to
         "Deploy from a branch" publishes the repo root, where the script above
         is still raw JSX — nothing executes, React never mounts, and a #0A0D12
         body renders as a black screen with no error in the console. That has
         cost two sessions already. This turns it into a message that says what
         to check. In a real build Vite rewrites the script above to compiled
         JS, #root fills, and this never fires. -->
    <script>
      /* Tests the one thing that is unambiguous: a .jsx src surviving into a
         served page means no build ran. Vite rewrites it to compiled .js, so
         this cannot false-positive on a real deploy — no timers, no guessing
         at a slow connection. */
      (function () {
        var root = document.getElementById("root");
        if (!root || !document.querySelector('script[src$=".jsx"]')) return;
        root.innerHTML =
          '<div style="font:16px/1.6 system-ui,sans-serif;color:#C9D3E0;max-width:34rem;margin:16vh auto;padding:0 6vw">' +
          '<p style="font:700 13px/1 ui-monospace,monospace;letter-spacing:.14em;color:#E0AB49">APOLOGETICS DOJANG</p>' +
          '<h1 style="font-size:23px;margin:14px 0 0">This page was published without being built.</h1>' +
          '<p style="color:#8A97A8">The app is fine — what is being served is the source, which no browser can run.</p>' +
          '<p>Fix: repo <b>Settings → Pages → Build and deployment → Source</b>, set it to <b>GitHub Actions</b>. ' +
          'Then re-run the "Deploy to GitHub Pages" workflow. "Deploy from a branch" publishes this repo unbuilt and lands you here.</p>' +
          '</div>';
      })();
    </script>
  </body>
</html>
